name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--legacy-peer-deps` is required: a transitive react-dom in the Expo
      # toolchain peers on a newer React than the SDK pins. Harmless, but strict
      # peer resolution refuses to install without it.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # The most valuable check of the three: it is the only one that catches a
      # module that type-checks but cannot actually be resolved by Metro.
      - name: Bundle for Android
        run: npx expo export --platform android --output-dir /tmp/echo-export-android

      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir /tmp/echo-export-ios

  lean-formalization:
    name: Lean proof and independent kernel check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build pinned Lean project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: algorithms/prime-sum/formal
          build: true
          nanoda: true
          nanoda-allow-sorry: false

      - name: Reject local proof escape hatches
        working-directory: algorithms/prime-sum/formal
        shell: bash
        run: |
          if rg -n '^\s*(axiom|sorry|admit|unsafe)\b' Formal --glob '*.lean'; then
            echo 'Forbidden Lean command found in the proof file.' >&2
            exit 1
          fi

      - name: Record theorem axiom dependencies
        working-directory: algorithms/prime-sum/formal
        run: |
          lake env lean Formal/Audit.lean
          lake env lean Formal/DensityPostprocessingAudit.lean
          lake env lean Formal/CanonicalHyperellipticCoreAudit.lean

  density-postprocessing:
    name: Exact density post-processing and fail-closed tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact rational certificate
        working-directory: algorithms/prime-sum/prototype/independent_verifier
        run: |
          python check_density_postprocess.py | diff -u expected_output.txt -
          python -m unittest -v test_fail_closed.py
